version: '3.8'

services:
  sql-server:
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong!Password123
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql

  redis:
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

  seq:
    ports:
      - "5341:80"
    environment:
      - ACCEPT_EULA=Y

  auth-service:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:443;http://+:80
      - ConnectionStrings__DefaultConnection=Server=sql-server;Database=AuthDb;User Id=sa;Password=YourStrong!Password123;TrustServerCertificate=true
      - JWT__Secret=YourSuperSecretKeyForJWTTokenGenerationThatIsAtLeast32CharsLong
      - JWT__ValidIssuer=https://localhost:5002
      - JWT__ValidAudience=https://localhost:5002
    ports:
      - "5002:80"
      - "5003:443"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  product-service:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:443;http://+:80
      - ConnectionStrings__DefaultConnection=Server=sql-server;Database=ProductDb;User Id=sa;Password=YourStrong!Password123;TrustServerCertificate=true
      - ConnectionStrings__Redis=redis:6379
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
      - JWT__Secret=YourSuperSecretKeyForJWTTokenGenerationThatIsAtLeast32CharsLong
    ports:
      - "5004:80"
      - "5005:443"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  log-service:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:443;http://+:80
      - ConnectionStrings__DefaultConnection=Server=sql-server;Database=LogDb;User Id=sa;Password=YourStrong!Password123;TrustServerCertificate=true
      - Seq__ServerUrl=http://seq:5341
    ports:
      - "5006:80"
      - "5007:443"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  api-gateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:443;http://+:80
      - JWT__Secret=YourSuperSecretKeyForJWTTokenGenerationThatIsAtLeast32CharsLong
    ports:
      - "5000:80"
      - "5001:443"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro