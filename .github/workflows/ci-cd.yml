name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore --configuration Release
    
    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal
    
    - name: Publish
      run: dotnet publish --no-build --configuration Release --output ./publish

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Auth Service
      uses: docker/build-push-action@v4
      with:
        context: ./AuthService
        file: ./AuthService/AuthService.API/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/auth-service:latest
    
    - name: Build and push Product Service
      uses: docker/build-push-action@v4
      with:
        context: ./ProductService
        file: ./ProductService/ProductService.API/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/product-service:latest
    
    - name: Build and push Log Service
      uses: docker/build-push-action@v4
      with:
        context: ./LogService
        file: ./LogService/LogService.API/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/log-service:latest
    
    - name: Build and push API Gateway
      uses: docker/build-push-action@v4
      with:
        context: ./ApiGateway
        file: ./ApiGateway/YarpGateway/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest

  deploy:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Deploy to Production
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        script: |
          cd /app/microservices
          docker-compose pull
          docker-compose up -d --remove-orphans
          docker system prune -f